<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Health System for Diabetes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #0077cc;
        }
        .login-container label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        .login-container input[type="email"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .login-container input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .login-container input[type="submit"]:hover {
            background-color: #005fa3;
        }
        .login-container .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        .login-container .forgot-password a {
            color: #0077cc;
            text-decoration: none;
        }
        .login-container .forgot-password a:hover {
            text-decoration: underline;
        }
        .login-container .signup-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-container .signup-link a {
            color: #0077cc;
            text-decoration: none;
        }
        .login-container .signup-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #ffe6e6;
            color: #d63031;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #d63031;
            display: none;
        }
        .success-message {
            background: #e6f7e6;
            color: #00b894;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #00b894;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="loginForm" action="index.html" method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <input type="submit" value="Login">
        </form>
        
        <div class="forgot-password">
            <a href="#">Forgot Password?</a>
        </div>
        
        <div class="signup-link">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Basic validation
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields!';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Check if user exists from signup
            const userData = localStorage.getItem('userData');
            
            if (userData) {
                const user = JSON.parse(userData);
                if (user.email === email) {
                    successMessage.textContent = 'Login successful! Redirecting...';
                    successMessage.style.display = 'block';
                    
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1000);
                    return;
                }
            }
            
            // Demo login for testing
            if (email === 'demo@diabeticcare.com' && password === 'demo123') {
                successMessage.textContent = 'Demo login successful! Redirecting...';
                successMessage.style.display = 'block';
                localStorage.setItem('isLoggedIn', 'true');
                
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                errorMessage.textContent = 'Invalid email or password. Try: demo@diabeticcare.com / demo123';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
