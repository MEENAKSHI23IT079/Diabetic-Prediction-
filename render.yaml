#################################################################
# render.yaml for DiabeticPrediction App                        #
#################################################################

previews:
  generation: automatic
  expireAfterDays: 7

services:
  # Flask Web Service
  - services:
  - type: web
    name: diabetic-prediction-app
    runtime: python
    repo: https://github.com/MEENAKSHI23IT079/Diabetic-Prediction.git
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    numInstances: 1
    region: oregon
    plan: standard
    autoDeployTrigger: commit
    domains:
      - diabetic-predictor.com
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: diabetic-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Optional: Scheduled task for sending daily reports or logs
  - type: cron
    name: daily-report
    runtime: python
    repo: https://github.com/MEENAKSHI23IT079/Diabetic-Prediction- .git
    buildCommand: pip install -r requirements.txt
    startCommand: python daily_report.py
    schedule: '0 8 * * *'  # Every day at 8 AM

databases:
  # PostgreSQL Database
  - name: diabetic-db
    plan: basic-1gb
    databaseName: diabetic
    user: diabeticuser
    postgresMajorVersion: '17'
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all
    diskSizeGB: 5

envVarGroups:
  - name: diabetic-common-settings
    envVars:
      - key: CONCURRENCY
        value: 2
