<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Health System for Diabetes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0077cc 0%, #005fa3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .signup-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .signup-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #0077cc;
            font-size: 2rem;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
        }
        
        .signup-container label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 8px;
        }
        
        .signup-container input[type="text"],
        .signup-container input[type="email"],
        .signup-container input[type="password"],
        .signup-container input[type="tel"],
        .signup-container input[type="date"],
        .signup-container select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .signup-container input:focus,
        .signup-container select:focus {
            outline: none;
            border-color: #0077cc;
            box-shadow: 0 0 10px rgba(0, 119, 204, 0.2);
        }
        
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
            gap: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            margin: 0;
            width: auto;
        }
        
        .checkbox-group label {
            font-weight: normal;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 0;
        }
        
        .signup-container input[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0077cc, #005fa3);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .signup-container input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 119, 204, 0.4);
        }
        
        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e1e5e9;
        }
        
        .login-link a {
            color: #0077cc;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        
        .login-link a:hover {
            color: #005fa3;
            text-decoration: underline;
        }
        
        .password-strength {
            height: 4px;
            background: #e1e5e9;
            border-radius: 2px;
            margin-top: -15px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .password-strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-weak { background: #ff4757; width: 25%; }
        .strength-fair { background: #ffa502; width: 50%; }
        .strength-good { background: #2ed573; width: 75%; }
        .strength-strong { background: #1dd1a1; width: 100%; }
        
        .error-message {
            background: #ffe6e6;
            color: #d63031;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #d63031;
            display: none;
        }
        
        .success-message {
            background: #e6f7e6;
            color: #00b894;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #00b894;
            display: none;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create Your Account</h2>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="signupForm" action="dashboard.html" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
            </div>
            
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
            
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                </div>
            </div>
            
            <label for="diabetesType">Diabetes Type (Optional)</label>
            <select id="diabetesType" name="diabetesType">
                <option value="">Select if applicable</option>
                <option value="type1">Type 1 Diabetes</option>
                <option value="type2">Type 2 Diabetes</option>
                <option value="gestational">Gestational Diabetes</option>
                <option value="prediabetes">Pre-diabetes</option>
                <option value="not-diabetic">Not diabetic (supporting someone)</option>
            </select>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
            <div class="password-strength">
                <div id="passwordStrengthFill" class="password-strength-fill"></div>
            </div>
            
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the <a href="#" style="color: #0077cc;">Terms of Service</a> and <a href="#" style="color: #0077cc;">Privacy Policy</a></label>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">I would like to receive health tips and updates via email</label>
            </div>
            
            <input type="submit" value="Create Account">
        </form>
        
        <div class="login-link">
            <p>Already have an account? <a href="loginpage.html">Sign In Here</a></p>
        </div>
    </div>

    <script>
        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthFill = document.getElementById('passwordStrengthFill');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            strengthFill.className = 'password-strength-fill';
            if (strength >= 2) strengthFill.classList.add('strength-weak');
            if (strength >= 3) strengthFill.classList.add('strength-fair');
            if (strength >= 4) strengthFill.classList.add('strength-good');
            if (strength >= 5) strengthFill.classList.add('strength-strong');
        });
        
        // Form validation
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value;
            const terms = document.getElementById('terms').checked;
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Validate password match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match!';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Validate password strength
            if (password.length < 8) {
                errorMessage.textContent = 'Password must be at least 8 characters long!';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Validate terms acceptance
            if (!terms) {
                errorMessage.textContent = 'Please accept the Terms of Service to continue!';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Simulate account creation
            successMessage.textContent = 'Account created successfully! Redirecting to dashboard...';
            successMessage.style.display = 'block';
            
            // Store user data in localStorage (for demo purposes)
            const userData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: email,
                phone: document.getElementById('phone').value,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                gender: document.getElementById('gender').value,
                diabetesType: document.getElementById('diabetesType').value,
                newsletter: document.getElementById('newsletter').checked,
                signupDate: new Date().toISOString()
            };
            
            localStorage.setItem('userData', JSON.stringify(userData));
            
            // Redirect after 2 seconds
            setTimeout(function() {
                window.location.href = 'index.html'; // Change to dashboard.html when you create it
            }, 2000);
        });
        
        // Email validation
        document.getElementById('email').addEventListener('blur', function() {
            const email = this.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (email && !emailRegex.test(email)) {
                this.style.borderColor = '#d63031';
            } else {
                this.style.borderColor = '#e1e5e9';
            }
        });
        
        // Phone number formatting
        document.getElementById('phone').addEventListener('input', function() {
            let value = this.value.replace(/\D/g, '');
            if (value.length >= 6) {
                value = value.replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3');
            } else if (value.length >= 3) {
                value = value.replace(/(\d{3})(\d{0,3})/, '($1) $2');
            }
            this.value = value;
        });
    </script>

</body>
</html>
